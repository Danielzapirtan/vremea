<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vreme</title>
<style>
  :root {
    --bg: #0f1923;
    --card: #1a2733;
    --card2: #1f3040;
    --accent: #4fc3f7;
    --accent2: #81d4fa;
    --text: #e8f4fd;
    --muted: #7a9bb5;
    --hot: #ff7043;
    --cold: #42a5f5;
    --border: #2a3f52;
    --tab-active: #4fc3f7;
    --tab-inactive: #2a3f52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
  }
  header {
    padding: 12px 16px 8px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .clock {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .location-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .coords {
    font-size: 0.7rem;
    color: var(--muted);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn:active { background: var(--border); }
  .btn-refresh {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
    padding: 5px 12px;
  }
  .btn-refresh:active { opacity: 0.8; }

  .tabs {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 73px;
    z-index: 99;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tab.active {
    color: var(--tab-active);
    border-bottom-color: var(--tab-active);
  }

  .panel { display: none; padding: 16px; }
  .panel.active { display: block; }

  /* Current weather */
  .temp-main {
    text-align: center;
    padding: 20px 10px 10px;
  }
  .temp-value {
    font-size: 5.5rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -3px;
    color: var(--text);
  }
  .temp-feels {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .weather-desc {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent2);
    margin-top: 6px;
  }
  .weather-icon {
    font-size: 3rem;
    margin-bottom: 4px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .metric-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .metric-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
  }
  .metric-sub {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Hourly */
  .hourly-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hour-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 70px 36px 1fr auto auto;
    align-items: center;
    gap: 10px;
  }
  .hour-time {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .hour-icon { font-size: 1.4rem; text-align: center; }
  .hour-desc {
    font-size: 0.75rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hour-temp {
    font-size: 1.25rem;
    font-weight: 800;
    text-align: right;
    min-width: 50px;
  }
  .hour-rain {
    font-size: 0.7rem;
    color: var(--cold);
    text-align: right;
    min-width: 36px;
  }
  .now-row { border-color: var(--accent); }

  /* Daily */
  .daily-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 90px 36px 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .day-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }
  .day-icon { font-size: 1.4rem; text-align: center; }
  .day-desc {
    font-size: 0.75rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day-temps {
    text-align: right;
    white-space: nowrap;
  }
  .day-high {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--hot);
    display: inline;
  }
  .day-sep { font-size: 0.85rem; color: var(--muted); margin: 0 3px; }
  .day-low {
    font-size: 1rem;
    font-weight: 600;
    color: var(--cold);
    display: inline;
  }

  /* Settings */
  .settings-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .settings-title {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  input[type="number"], input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .label-small {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .field-group { flex: 1; }
  .btn-full {
    width: 100%;
    padding: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 4px;
    text-align: center;
  }
  .status-msg {
    font-size: 0.78rem;
    color: var(--accent);
    margin-top: 8px;
    min-height: 18px;
    text-align: center;
  }
  .error-msg { color: #ef9a9a; }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--muted);
    gap: 12px;
    font-size: 0.9rem;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wind-dir { font-size: 1rem; }

  @media (min-width: 400px) {
    .temp-value { font-size: 6.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="clock" id="clock">--:--:--</div>
    <button class="btn btn-refresh" onclick="refreshWeather()">⟳ Actualizare</button>
  </div>
  <div class="location-row">
    <div class="coords" id="coordsDisplay">Nicio locație salvată</div>
    <button class="btn" onclick="switchTab('settings')">⚙</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('current')" id="tab-current">Acum</div>
  <div class="tab" onclick="switchTab('hourly')" id="tab-hourly">Ore</div>
  <div class="tab" onclick="switchTab('daily')" id="tab-daily">Zile</div>
  <div class="tab" onclick="switchTab('settings')" id="tab-settings">Locație</div>
</div>

<div class="panel active" id="panel-current">
  <div class="loading" id="loading-current">
    <div class="spinner"></div>
    <span>Se încarcă datele...</span>
  </div>
  <div id="current-content" style="display:none"></div>
</div>

<div class="panel" id="panel-hourly">
  <div class="loading" id="loading-hourly">
    <div class="spinner"></div>
  </div>
  <div class="hourly-list" id="hourly-content" style="display:none"></div>
</div>

<div class="panel" id="panel-daily">
  <div class="loading" id="loading-daily">
    <div class="spinner"></div>
  </div>
  <div class="daily-list" id="daily-content" style="display:none"></div>
</div>

<div class="panel" id="panel-settings">
  <div class="settings-card">
    <div class="settings-title">Locație GPS</div>
    <div class="input-row">
      <div class="field-group">
        <div class="label-small">Latitudine</div>
        <input type="number" id="inputLat" placeholder="45.7489" step="0.0001">
      </div>
      <div class="field-group">
        <div class="label-small">Longitudine</div>
        <input type="number" id="inputLon" placeholder="21.2087" step="0.0001">
      </div>
    </div>
    <button class="btn btn-full" onclick="saveLocation()">💾 Salvează locația</button>
    <button class="btn btn-full" style="margin-top:8px;" onclick="detectLocation()">📍 Detectează automat</button>
    <div class="status-msg" id="settingsStatus"></div>
  </div>
  <div class="settings-card">
    <div class="settings-title">Informații</div>
    <div style="font-size:0.78rem;color:var(--muted);line-height:1.6;">
      Date furnizate de <strong style="color:var(--accent)">Open-Meteo</strong> (API gratuit, fără cheie).<br>
      Locația este salvată local în browser.<br>
      Actualizarea se face la reîncărcarea paginii sau manual.
    </div>
  </div>
</div>

<script>
const WMO = {
  0:  ['☀️','Cer senin'],
  1:  ['🌤️','Predominant senin'],
  2:  ['⛅','Parțial noros'],
  3:  ['☁️','Înnorat'],
  45: ['🌫️','Ceață'],
  48: ['🌫️','Ceață cu chiciură'],
  51: ['🌦️','Burnițe ușoare'],
  53: ['🌦️','Burnițe moderate'],
  55: ['🌧️','Burnițe intense'],
  61: ['🌧️','Ploaie ușoară'],
  63: ['🌧️','Ploaie moderată'],
  65: ['🌧️','Ploaie puternică'],
  71: ['🌨️','Ninsoare ușoară'],
  73: ['🌨️','Ninsoare moderată'],
  75: ['❄️','Ninsoare abundentă'],
  77: ['🌨️','Fulgi de gheață'],
  80: ['🌦️','Averse ușoare'],
  81: ['🌧️','Averse moderate'],
  82: ['⛈️','Averse puternice'],
  85: ['🌨️','Averse de ninsoare'],
  86: ['❄️','Averse abundente de ninsoare'],
  95: ['⛈️','Furtună'],
  96: ['⛈️','Furtună cu grindină'],
  99: ['⛈️','Furtună puternică cu grindină'],
};

function wmo(code) {
  return WMO[code] || ['🌡️', 'Necunoscut'];
}

function windDirName(deg) {
  const dirs = ['N','NE','E','SE','S','SV','V','NV'];
  return dirs[Math.round(deg / 45) % 8];
}

function beaufort(kmh) {
  if (kmh < 1) return '0 Bf';
  if (kmh < 6) return '1 Bf';
  if (kmh < 12) return '2 Bf';
  if (kmh < 20) return '3 Bf';
  if (kmh < 29) return '4 Bf';
  if (kmh < 39) return '5 Bf';
  if (kmh < 50) return '6 Bf';
  if (kmh < 62) return '7 Bf';
  if (kmh < 75) return '8 Bf';
  if (kmh < 89) return '9 Bf';
  if (kmh < 103) return '10 Bf';
  if (kmh < 118) return '11 Bf';
  return '12 Bf';
}

function tempColor(t) {
  if (t >= 35) return '#ff3d00';
  if (t >= 28) return '#ff7043';
  if (t >= 20) return '#ffa726';
  if (t >= 10) return '#e8f4fd';
  if (t >= 0)  return '#81d4fa';
  return '#42a5f5';
}

let weatherData = null;

function loadLocation() {
  const lat = localStorage.getItem('wx_lat');
  const lon = localStorage.getItem('wx_lon');
  if (lat && lon) return { lat: parseFloat(lat), lon: parseFloat(lon) };
  return null;
}

function saveLocation() {
  const lat = parseFloat(document.getElementById('inputLat').value);
  const lon = parseFloat(document.getElementById('inputLon').value);
  const st = document.getElementById('settingsStatus');
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    st.textContent = 'Coordonate invalide.';
    st.className = 'status-msg error-msg';
    return;
  }
  localStorage.setItem('wx_lat', lat.toFixed(6));
  localStorage.setItem('wx_lon', lon.toFixed(6));
  st.textContent = 'Locație salvată! Se actualizează...';
  st.className = 'status-msg';
  updateCoordsDisplay(lat, lon);
  fetchWeather(lat, lon);
  setTimeout(() => switchTab('current'), 600);
}

function detectLocation() {
  const st = document.getElementById('settingsStatus');
  if (!navigator.geolocation) {
    st.textContent = 'Geolocation indisponibil.';
    st.className = 'status-msg error-msg';
    return;
  }
  st.textContent = 'Se detectează...';
  st.className = 'status-msg';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    document.getElementById('inputLat').value = lat.toFixed(6);
    document.getElementById('inputLon').value = lon.toFixed(6);
    localStorage.setItem('wx_lat', lat.toFixed(6));
    localStorage.setItem('wx_lon', lon.toFixed(6));
    st.textContent = 'Locație detectată și salvată!';
    st.className = 'status-msg';
    updateCoordsDisplay(lat, lon);
    fetchWeather(lat, lon);
    setTimeout(() => switchTab('current'), 800);
  }, err => {
    st.textContent = 'Eroare: ' + err.message;
    st.className = 'status-msg error-msg';
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function updateCoordsDisplay(lat, lon) {
  const ns = lat >= 0 ? 'N' : 'S';
  const ew = lon >= 0 ? 'E' : 'V';
  document.getElementById('coordsDisplay').textContent =
    `${Math.abs(lat).toFixed(5)}°${ns}  ${Math.abs(lon).toFixed(5)}°${ew}`;
}

function refreshWeather() {
  const loc = loadLocation();
  if (!loc) { switchTab('settings'); return; }
  fetchWeather(loc.lat, loc.lon);
}

async function fetchWeather(lat, lon) {
  showLoading(true);
  try {
    const url = `https://api.open-meteo.com/v1/forecast?` +
      `latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,visibility` +
      `&minutely_15=temperature_2m,weather_code,precipitation_probability,precipitation` +
      `&hourly=temperature_2m,weather_code,precipitation_probability,precipitation` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,precipitation_probability_max` +
      `&wind_speed_unit=kmh&precipitation_unit=mm` +
      `&timezone=auto&forecast_days=5`;

    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Eroare API: ' + resp.status);
    weatherData = await resp.json();
    renderAll(weatherData);
  } catch(e) {
    showError(e.message);
  }
}

function showLoading(on) {
  ['current','hourly','daily'].forEach(p => {
    document.getElementById('loading-' + p).style.display = on ? 'flex' : 'none';
    const c = document.getElementById(p === 'current' ? 'current-content' : p + '-content');
    if (c) c.style.display = on ? 'none' : (p === 'current' ? 'block' : 'flex');
  });
  if (on) {
    document.getElementById('hourly-content').style.display = 'none';
    document.getElementById('daily-content').style.display = 'none';
  }
}

function showError(msg) {
  showLoading(false);
  document.getElementById('current-content').innerHTML =
    `<div class="loading" style="color:#ef9a9a">⚠️ ${msg}<br><small style="margin-top:8px;color:var(--muted)">Verificați conexiunea și coordonatele.</small></div>`;
  document.getElementById('current-content').style.display = 'block';
}

function renderAll(d) {
  renderCurrent(d);
  renderHourly(d);
  renderDaily(d);
  showLoading(false);
}

function renderCurrent(d) {
  const c = d.current;
  const [icon, desc] = wmo(c.weather_code);
  const t = c.temperature_2m;
  const feels = c.apparent_temperature;
  const color = tempColor(t);

  const pres = c.surface_pressure ? Math.round(c.surface_pressure) + ' hPa' : '—';
  const vis = c.visibility ? (c.visibility >= 1000 ? (c.visibility/1000).toFixed(1) + ' km' : c.visibility + ' m') : '—';
  const windDir = windDirName(c.wind_direction_10m);
  const windSpd = Math.round(c.wind_speed_10m);
  const gusts = Math.round(c.wind_gusts_10m);
  const precip = c.precipitation !== undefined ? c.precipitation.toFixed(1) + ' mm' : '—';

  document.getElementById('current-content').innerHTML = `
    <div class="temp-main">
      <div class="weather-icon">${icon}</div>
      <div class="temp-value" style="color:${color}">${t}°</div>
      <div class="weather-desc">${desc}</div>
      <div class="temp-feels">Senzație termică: <strong>${feels}°C</strong></div>
    </div>
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">💧 Umiditate</div>
        <div class="metric-value">${c.relative_humidity_2m}%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💨 Vânt</div>
        <div class="metric-value">${windSpd} km/h</div>
        <div class="metric-sub">${windDir} · Rafale: ${gusts} km/h · ${beaufort(windSpd)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🌡️ Presiune</div>
        <div class="metric-value">${pres}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">☁️ Acoperire nori</div>
        <div class="metric-value">${c.cloud_cover}%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">👁️ Vizibilitate</div>
        <div class="metric-value">${vis}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🌧️ Precipitații</div>
        <div class="metric-value">${precip}</div>
      </div>
    </div>
  `;
}

function renderHourly(d) {
  const now = new Date();

  // Use the 15-minute series for the first row; the hourly series starts
  // with the nearest whole hour and cannot provide the quarter-hour value.
  const quarter = d.minutely_15;
  const hourly = d.hourly;
  const last15 = new Date(now);
  last15.setSeconds(0, 0);
  last15.setMinutes(Math.floor(last15.getMinutes() / 15) * 15);

  const rows = [];
  if (quarter && Array.isArray(quarter.time) && quarter.time.length &&
      Array.isArray(quarter.temperature_2m) &&
      Array.isArray(quarter.weather_code) &&
      Array.isArray(quarter.precipitation_probability)) {
    let quarterIdx = -1;
    for (let i = 0; i < quarter.time.length; i++) {
      if (new Date(quarter.time[i]) <= last15) quarterIdx = i;
      else break;
    }
    if (quarterIdx >= 0) {
      rows.push({
        time: quarter.time[quarterIdx],
        temp: quarter.temperature_2m[quarterIdx],
        code: quarter.weather_code[quarterIdx],
        prob: quarter.precipitation_probability[quarterIdx],
        isNow: true
      });
    }
  }

  // Keep the panel usable if an older or restricted API response omits
  // minutely_15; in that case the hourly value is the only safe fallback.
  if (!rows.length) {
    let hourlyIdx = -1;
    for (let i = 0; i < hourly.time.length; i++) {
      if (new Date(hourly.time[i]) <= last15) hourlyIdx = i;
      else break;
    }
    if (hourlyIdx >= 0) {
      rows.push({
        time: hourly.time[hourlyIdx],
        temp: hourly.temperature_2m[hourlyIdx],
        code: hourly.weather_code[hourlyIdx],
        prob: hourly.precipitation_probability[hourlyIdx],
        isNow: true
      });
    }
  }

  // Add the next four whole-hour forecasts after the quarter-hour row.
  const firstFutureTime = rows.length ? new Date(rows[0].time) : last15;
  for (let i = 0; i < hourly.time.length && rows.length < 5; i++) {
    const time = new Date(hourly.time[i]);
    if (time > firstFutureTime) {
      rows.push({
        time: hourly.time[i],
        temp: hourly.temperature_2m[i],
        code: hourly.weather_code[i],
        prob: hourly.precipitation_probability[i],
        isNow: false
      });
    }
  }

  let html = '';
  rows.forEach(row => {
    const t = new Date(row.time);
    const label = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
    const [icon, desc] = wmo(row.code);
    const temp = row.temp;
    const prob = row.prob;
    const color = tempColor(temp);
    const rainStr = prob > 0 ? `${prob}%` : '';
    html += `
      <div class="hour-row${row.isNow ? ' now-row' : ''}">
        <div class="hour-time">${row.isNow ? '▶ ' : ''}${label}</div>
        <div class="hour-icon">${icon}</div>
        <div class="hour-desc">${desc}</div>
        <div class="hour-temp" style="color:${color}">${temp}°</div>
        <div class="hour-rain">${rainStr ? '💧' + rainStr : ''}</div>
      </div>
    `;
  });

  document.getElementById('hourly-content').innerHTML = html;
  document.getElementById('hourly-content').style.flexDirection = 'column';
}

function renderDaily(d) {
  const dd = d.daily;
  const dayNames = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
  const monthNames = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];

  // Show today + next 4 days = 5 days max
  const count = Math.min(5, dd.time.length);
  let html = '';
  for (let i = 0; i < count; i++) {
    const date = new Date(dd.time[i] + 'T12:00:00');
    const isToday = i === 0;
    const dayLabel = isToday
      ? 'Azi'
      : `${dayNames[date.getDay()]} ${date.getDate()} ${monthNames[date.getMonth()]}`;
    const high = dd.temperature_2m_max[i];
    const low = dd.temperature_2m_min[i];
    const [icon, desc] = wmo(dd.weather_code[i]);
    html += `
      <div class="day-row">
        <div class="day-name">${dayLabel}</div>
        <div class="day-icon">${icon}</div>
        <div class="day-desc">${desc}</div>
        <div class="day-temps">
          <span class="day-high">${high}°</span>
          <span class="day-sep">/</span>
          <span class="day-low">${low}°</span>
        </div>
      </div>
    `;
  }
  document.getElementById('daily-content').innerHTML = html;
}

function pad(n) { return String(n).padStart(2, '0'); }

function switchTab(name) {
  ['current','hourly','daily','settings'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
    document.getElementById('panel-' + t).classList.toggle('active', t === name);
  });
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

// Init
setInterval(updateClock, 1000);
updateClock();

const loc = loadLocation();
if (loc) {
  updateCoordsDisplay(loc.lat, loc.lon);
  document.getElementById('inputLat').value = loc.lat;
  document.getElementById('inputLon').value = loc.lon;
  fetchWeather(loc.lat, loc.lon);
} else {
  showLoading(false);
  document.getElementById('current-content').innerHTML =
    `<div class="loading" style="flex-direction:column;gap:14px">
      <div style="font-size:2rem">📍</div>
      <div style="color:var(--muted);text-align:center">Setați locația în tab-ul <strong style="color:var(--accent)">Locație</strong><br>pentru a vedea vremea.</div>
      <button class="btn" onclick="switchTab('settings')" style="font-size:0.9rem;padding:10px 20px">Setează locația</button>
    </div>`;
  document.getElementById('current-content').style.display = 'block';
  switchTab('settings');
}
</script>
